<!-- @dsCard group="Colors" viewport="700x190" name="Purple & violet" subtitle="Badge and Tab carry their own primary — a real conflict in the source" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 20px; background: var(--ds-surface-page); }
  .r { display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .c { display: flex; flex-direction: column; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 56px; border-radius: var(--ds-radius-md); }
  .nm { font-size: 11px; font-weight: 500; line-height: 14px; color: var(--ds-text-label); }
  .hex { font-family: var(--ds-font-mono); font-size: 10px; line-height: 14px; color: var(--ds-text-secondary); }
  .use { font-size: 10px; line-height: 14px; color: var(--ds-text-placeholder); }
  .lbl { font-family: var(--ds-font-mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ds-text-placeholder); }
</style>
</head>
<body>
<div class="c">
  <div class="r">
  <div class="sw"><div class="chip" style="background: #F9F5FF; border: 1px solid var(--ds-border-default);"></div>
    <div><div class="nm">Purple 50</div><div class="hex">#F9F5FF</div><div class="use">badge fill</div></div></div>
  <div class="sw"><div class="chip" style="background: #9747FF;"></div>
    <div><div class="nm">Purple 500</div><div class="hex">#9747FF</div></div></div>
  <div class="sw"><div class="chip" style="background: #7F56D9;"></div>
    <div><div class="nm">Violet 600</div><div class="hex">#7F56D9</div><div class="use">Badge primary</div></div></div>
  <div class="sw"><div class="chip" style="background: #6941C6;"></div>
    <div><div class="nm">Violet 700</div><div class="hex">#6941C6</div><div class="use">Tab underline</div></div></div>
  </div>
  <div class="use" style="max-width: 620px;">Badge <code style="font-family: var(--ds-font-mono)">primary</code> and the active Tab underline are violet, not Blue 600. Inherited from the source file — flagged rather than silently corrected.</div>
</div>
</body>
</html>
