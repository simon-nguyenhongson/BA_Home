<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 20px; background: var(--ds-surface-page); }
  .r { display: flex; flex-direction: row; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .c { display: flex; flex-direction: column; gap: 8px; }
  img { display: block; border-radius: var(--ds-radius-md); object-fit: cover; }
  .rnd { border-radius: 9999px; }
  .use { font-size: 10px; line-height: 14px; color: var(--ds-text-placeholder); max-width: 200px; }
</style>
</head>
<body>
<div class="r">
  <img src="../assets/67da9fddd372b1b5.jpg" alt="Avatar photo" width="72" height="72" class="rnd" />
  <img src="../assets/b5c3a2951b15bd05.jpg" alt="Avatar photo" width="72" height="72" class="rnd" />
  <img src="../assets/e9be38c71c4e3ee1.jpg" alt="Avatar photo" width="72" height="72" class="rnd" />
  <img src="../assets/502dc04e1538b2bd.jpg" alt="Table thumbnail" width="112" height="72" />
  <img src="../assets/436985b609d05307.png" alt="Placeholder fill" width="112" height="72" style="border: 1px solid var(--ds-border-default);" />
  <div class="c">
    <span class="use">Avatars are circular, warm-toned, shot at eye level. The PNG is the neutral placeholder fill used where a photo is absent.</span>
    <span class="use">These are the only bitmaps in the system — no stock library, no generated imagery.</span>
  </div>
</div>
</body>
</html>
