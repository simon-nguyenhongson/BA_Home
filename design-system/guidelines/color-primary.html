<!-- @dsCard group="Colors" viewport="700x160" name="Primary — Blue dark" subtitle="Blue 600 #155EEF carries every interactive element" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 20px; background: var(--ds-surface-page); }
  .r { display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .c { display: flex; flex-direction: column; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 56px; border-radius: var(--ds-radius-md); }
  .nm { font-size: 11px; font-weight: 500; line-height: 14px; color: var(--ds-text-label); }
  .hex { font-family: var(--ds-font-mono); font-size: 10px; line-height: 14px; color: var(--ds-text-secondary); }
  .use { font-size: 10px; line-height: 14px; color: var(--ds-text-placeholder); }
  .lbl { font-family: var(--ds-font-mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ds-text-placeholder); }
</style>
</head>
<body>
<div class="r">
  <div class="sw"><div class="chip" style="background: #F5F8FF; border: 1px solid var(--ds-border-default);"></div>
    <div><div class="nm">Blue 25</div><div class="hex">#F5F8FF</div></div></div>
  <div class="sw"><div class="chip" style="background: #EFF4FF; border: 1px solid var(--ds-border-default);"></div>
    <div><div class="nm">Blue 50</div><div class="hex">#EFF4FF</div><div class="use">focus ring</div></div></div>
  <div class="sw"><div class="chip" style="background: #D1E0FF;"></div>
    <div><div class="nm">Blue 100</div><div class="hex">#D1E0FF</div><div class="use">selection</div></div></div>
  <div class="sw"><div class="chip" style="background: #B2CCFF;"></div>
    <div><div class="nm">Blue 200</div><div class="hex">#B2CCFF</div><div class="use">loading</div></div></div>
  <div class="sw"><div class="chip" style="background: #84ADFF;"></div>
    <div><div class="nm">Blue 300</div><div class="hex">#84ADFF</div><div class="use">focus border</div></div></div>
  <div class="sw"><div class="chip" style="background: #2970FF;"></div>
    <div><div class="nm">Blue 500</div><div class="hex">#2970FF</div></div></div>
  <div class="sw"><div class="chip" style="background: #155EEF;"></div>
    <div><div class="nm">Blue 600</div><div class="hex">#155EEF</div><div class="use">PRIMARY · 577×</div></div></div>
</div>
</body>
</html>
