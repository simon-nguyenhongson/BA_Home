<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="8px on controls, 12px on cards — nothing is fully round except avatars" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 20px; background: var(--ds-surface-page); }
  .r { display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .c { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--ds-font-mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ds-text-placeholder); }
  .hex { font-family: var(--ds-font-mono); font-size: 10px; line-height: 14px; color: var(--ds-text-secondary); }
  .use { font-size: 10px; line-height: 14px; color: var(--ds-text-placeholder); }
  .row { display: grid; grid-template-columns: 108px 132px minmax(0, 1fr); gap: 16px; align-items: baseline; padding: 5px 0; }
  .nm { font-size: 12px; font-weight: 600; color: var(--ds-text-label); }
</style>
</head>
<body>
<div class="r" style="gap: 20px;">
  <div class="c" style="gap: 6px;"><div style="width: 112px; height: 64px; border-radius: 6px; background: var(--ds-surface-muted); border: 1px solid var(--ds-border-default);"></div><span class="hex">6px</span><span class="use">sm · nav row</span></div>
  <div class="c" style="gap: 6px;"><div style="width: 112px; height: 64px; border-radius: 8px; background: var(--ds-surface-muted); border: 1px solid var(--ds-border-default);"></div><span class="hex">8px</span><span class="use">md · button, field, cell</span></div>
  <div class="c" style="gap: 6px;"><div style="width: 112px; height: 64px; border-radius: 12px; background: var(--ds-surface-muted); border: 1px solid var(--ds-border-default);"></div><span class="hex">12px</span><span class="use">lg · card, panel</span></div>
  <div class="c" style="gap: 6px;"><div style="width: 112px; height: 64px; border-radius: 16px; background: var(--ds-surface-muted); border: 1px solid var(--ds-border-default);"></div><span class="hex">16px</span><span class="use">pill · badge</span></div>
  <div class="c" style="gap: 6px;"><div style="width: 64px; height: 64px; border-radius: 9999px; background: var(--ds-surface-muted); border: 1px solid var(--ds-border-default);"></div><span class="hex">full</span><span class="use">avatar, dot</span></div>
</div>
</body>
</html>
