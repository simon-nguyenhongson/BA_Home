<!-- @dsCard group="Spacing" viewport="700x170" name="Control heights" subtitle="Three button heights and one 40px table row" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 20px; background: var(--ds-surface-page); }
  .r { display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .c { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--ds-font-mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ds-text-placeholder); }
  .hex { font-family: var(--ds-font-mono); font-size: 10px; line-height: 14px; color: var(--ds-text-secondary); }
  .use { font-size: 10px; line-height: 14px; color: var(--ds-text-placeholder); }
  .row { display: grid; grid-template-columns: 108px 132px minmax(0, 1fr); gap: 16px; align-items: baseline; padding: 5px 0; }
  .nm { font-size: 12px; font-weight: 600; color: var(--ds-text-label); }
</style>
</head>
<body>
<div class="c" style="gap: 12px;">
  <div class="r" style="gap: 16px; align-items: flex-end;">
    <div class="c" style="gap: 6px;"><div style="width: 132px; height: 28px; border-radius: 8px; background: var(--ds-surface-card); border: 1px solid var(--ds-border-default); box-shadow: var(--ds-shadow-xs); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--ds-text-label);">28px</div><span class="use">S · tight space</span></div>
    <div class="c" style="gap: 6px;"><div style="width: 132px; height: 32px; border-radius: 8px; background: var(--ds-surface-card); border: 1px solid var(--ds-border-default); box-shadow: var(--ds-shadow-xs); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--ds-text-label);">32px</div><span class="use">M · default</span></div>
    <div class="c" style="gap: 6px;"><div style="width: 132px; height: 40px; border-radius: 8px; background: var(--ds-surface-card); border: 1px solid var(--ds-border-default); box-shadow: var(--ds-shadow-xs); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--ds-text-label);">40px</div><span class="use">L · forms, dialogs</span></div>
    <div class="c" style="gap: 6px;"><div style="width: 132px; height: 40px; border: 1px solid var(--ds-border-default); display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: var(--ds-text-primary);">Cell</div><span class="use">40px · table row</span></div>
  </div>
  <span class="use">Padding: S 8px · M 10px 12px · L 10px 16px.</span>
</div>
</body>
</html>
