<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script type="importmap">
{ "imports": { "react": "https://esm.sh/react@18.3.1", "react-dom/client": "https://esm.sh/react-dom@18.3.1/client" } }
</script>
<style>
  body { margin: 0; padding: 16px 20px; background: var(--ds-surface-page); }
  #root { display: flex; flex-direction: row; gap: 32px; align-items: flex-end; flex-wrap: wrap; }
  .c { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .lbl { font-family: var(--ds-font-mono); font-size: 10px; color: var(--ds-text-placeholder); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { Illustration } from "../components/navigation/_impl.js";
const h = React.createElement;
const cell = (style2, color) => h("div", { className: "c", key: style2 + color },
  h(Illustration, { style2, color, size: "lg" }),
  h("span", { className: "lbl" }, style2 + " · " + color));
createRoot(document.getElementById("root")).render(
  h(React.Fragment, null,
    cell("box", "primary"), cell("cloud", "gray"), cell("documents", "primary"),
    cell("box", "gray"), cell("cloud", "primary"))
);
</script>
</body>
</html>
