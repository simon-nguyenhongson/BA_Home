<!-- @dsCard group="Components" viewport="700x340" name="Icons — 233 glyphs" subtitle="16px grid, currentColor fill, one Icon wrapper" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Icons</title>
<link rel="stylesheet" href="../../styles.css" />
<script type="importmap">
{ "imports": { "react": "https://esm.sh/react@18.3.1", "react-dom/client": "https://esm.sh/react-dom@18.3.1/client" } }
</script>
<style>
  body { padding: 20px; background: var(--ds-surface-page); }
  .grid { display: flex; flex-direction: column; gap: 16px; }
  .lbl { font-family: var(--ds-font-mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ds-text-placeholder); }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 10px; color: var(--ds-text-label); }
  .tints { display: flex; flex-direction: row; gap: 24px; align-items: center; }
  .tint { display: flex; flex-direction: row; gap: 8px; align-items: center; font-size: 12px; }
  .sizes { display: flex; flex-direction: row; gap: 18px; align-items: flex-end; color: var(--ds-text-label); }
  .sep { height: 1px; background: var(--ds-border-subtle); }
</style>
</head>
<body>
<div id="root" class="grid"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import icons from "./icon-data.js";
import { Icon } from "./_icon-runtime.js";

const h = React.createElement;
const names = Object.keys(icons);
const sheet = names.slice(0, 72);

createRoot(document.getElementById("root")).render(
  h(React.Fragment, null,
    h("div", { className: "tints" },
      h("span", { className: "lbl" }, names.length + " glyphs"),
      h("div", { className: "tint", style: { color: "var(--ds-text-primary)" } }, h(Icon, { name: "IconSearch" }), "text-primary"),
      h("div", { className: "tint", style: { color: "var(--ds-brand)" } }, h(Icon, { name: "IconCheckmark" }), "brand"),
      h("div", { className: "tint", style: { color: "var(--ds-danger)" } }, h(Icon, { name: "IconTrashCan" }), "danger"),
      h("div", { className: "tint", style: { color: "var(--ds-text-placeholder)" } }, h(Icon, { name: "IconLocked" }), "disabled")),
    h("div", { className: "sizes" },
      h("span", { className: "lbl" }, "sizes"),
      h(Icon, { name: "IconSettings", size: 16 }),
      h(Icon, { name: "IconSettings", size: 20 }),
      h(Icon, { name: "IconSettings", size: 24 }),
      h(Icon, { name: "IconSettings", size: 32 })),
    h("div", { className: "sep" }),
    h("div", { className: "sheet" }, ...sheet.map((n, i) => h(Icon, { key: i, name: n, size: 20 })))
  )
);
</script>
</body>
</html>
